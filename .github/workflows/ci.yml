name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências do frontend
        run: npm --prefix web ci

      - name: Verificar tipos do frontend
        run: npm --prefix web run typecheck

      - name: Compilar o frontend
        run: npm --prefix web run build

      - name: Formatação e análise estática
        run: |
          gofmt -l . | (! grep .) || (echo "::error::arquivos mal formatados"; exit 1)
          go vet ./...

      - name: Testes com detector de corrida
        run: go test -race -coverprofile=coverage.out ./...

      - name: Cobertura
        run: go tool cover -func=coverage.out | tail -1

      - name: Teste de fumaça do binário
        run: |
          go build -o archcode-studio ./cmd/archcode-studio
          mkdir -p /tmp/smoke && cd /tmp/smoke
          "$GITHUB_WORKSPACE/archcode-studio" init --name "CI Smoke"
          "$GITHUB_WORKSPACE/archcode-studio" prd
          "$GITHUB_WORKSPACE/archcode-studio" validate
          "$GITHUB_WORKSPACE/archcode-studio" estimate
          "$GITHUB_WORKSPACE/archcode-studio" export svg --out /tmp/smoke/arch.svg
          test -s /tmp/smoke/arch.svg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: web/package-lock.json }

      - run: npm --prefix web ci
      - run: make release VERSION=${GITHUB_REF_NAME#v}

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
