services:
  archcode-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archcode-studio
    restart: unless-stopped
    environment:
      PORT: 8765
      ARCHCODE_DIR: /workspace
      ARCHCODE_PROJECT_NAME: ${ARCHCODE_PROJECT_NAME:-ArchCode Project}
      # URL pública (ex.: https://arch.seudominio.com) — usada pelo MCP via SSE
      ARCHCODE_BASE_URL: ${ARCHCODE_BASE_URL:-}
    volumes:
      - ${WORKSPACE_DIR_HOST:-./workspace}:/workspace
    ports:
      - "${PORT_BIND:-8765}:8765"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
