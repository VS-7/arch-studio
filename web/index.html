<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ArchCode Studio</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (ver src/lib/theme.tsx).
      try {
        var t = localStorage.getItem('archcode-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6fde'/><path d='M28 68 L50 28 L72 68' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M38 58 H62' stroke='white' stroke-width='9' stroke-linecap='round'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
